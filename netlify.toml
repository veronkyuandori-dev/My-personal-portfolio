[build]
  command = "vite build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

[[redirects]]
  from = "/api/blogs"
  to = "/.netlify/functions/blogs"
  status = 200

[[redirects]]
  from = "/api/github-stats"
  to = "/.netlify/functions/github-stats"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
